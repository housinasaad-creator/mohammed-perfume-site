<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070504">
<title>MOHAMMED · Maison de Parfum</title>
<meta name="description" content="Concept project: a real-time 3D luxury fragrance store with a working bag and checkout (demo). Fictional brand, designed and developed by Muhammed Elhuseyin.">
<meta property="og:type" content="website">
<meta property="og:title" content="MOHAMMED · Maison de Parfum (concept)">
<meta property="og:description" content="Six scents, six atmospheres. A real-time 3D fragrance store concept.">
<meta property="og:image" content="https://housinasaad-creator.github.io/mohammed-perfume-site/assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://housinasaad-creator.github.io/mohammed-perfume-site/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "./js/vendor/three.module.min.js" } }</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="is-loading">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="flg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff6a00"/><stop offset=".55" stop-color="#ffb347"/><stop offset="1" stop-color="#fff0b8"/></linearGradient>
  </defs>
</svg>

<canvas id="gl" aria-hidden="true"></canvas>
<div class="scrim" id="scrim" aria-hidden="true"></div>

<div class="loader" id="loader" aria-hidden="true">
  <div class="loader-flame" id="loaderFlame"></div>
  <p class="loader-txt" id="loaderTxt" data-i="loader"></p>
  <div class="loader-bar"><i id="loaderBar"></i></div>
</div>

<header class="hdr" id="hdr">
  <a class="logo" href="#top" aria-label="Mohammed">
    <span class="logo-flame" id="logoFlame"></span>
    <span class="logo-word" id="brand" data-i="brand"></span>
  </a>
  <nav class="nav" id="nav">
    <a href="#top" data-i="nav.home"></a>
    <a href="#collection" data-i="nav.collection"></a>
    <a href="#wear" data-i="nav.wear"></a>
    <a href="#craft" data-i="nav.craft"></a>
    <a href="#voices" data-i="nav.voices"></a>
  </nav>
  <div class="hdr-actions">
    <button class="icon-btn sound" id="soundBtn" type="button" aria-label="Sound" aria-pressed="false" data-cursor="sound">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="w1" d="M16 9a4 4 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path class="w2" d="M18.5 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path class="off" d="M17 9l5 6M22 9l-5 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </button>
    <button class="lang" id="lang" type="button" data-i="langBtn" aria-label="Language"></button>
    <button class="bag" id="bag" type="button" aria-label="Bag">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <b id="bagCount">0</b>
    </button>
  </div>
</header>

<main id="top">
  <!-- ============ الهيرو: خمس وقفات فوق المشهد الثلاثي الأبعاد ============ -->
  <section class="hero" id="hero" aria-label="Story">
    <div class="chapters" id="chapters"></div>
    <nav class="dots" id="dots" aria-label="Chapters"></nav>
    <div class="cue" id="cue" aria-hidden="true"><i></i><span data-i="scrollCue"></span></div>
    <button class="sound-tip" id="soundTip" type="button" data-i="soundTip" data-cursor="sound"></button>
    <div class="progress" aria-hidden="true"><i id="progressBar"></i></div>
  </section>

  <!-- ============ المجموعة: رف العطور ============ -->
  <section class="shop" id="collection">
    <header class="shop-head">
      <p class="kicker" data-i="shop.k"></p>
      <h2 class="h2" data-i="shop.t"></h2>
      <p class="lead" data-i="shop.s"></p>
    </header>

    <div class="fb-stage" id="fbStage" aria-hidden="true"><img id="fbImg" alt=""></div>

    <aside class="panel" id="panel" aria-live="polite">
      <div class="panel-in" id="panelIn">
        <p class="tag" id="pTag"></p>
        <h3 class="pname" id="pName"></h3>
        <p class="pdesc" id="pDesc"></p>
        <ul class="pyr" id="pPyr"></ul>

        <div class="opt">
          <p class="opt-l" data-i="shop.size"></p>
          <div class="sizes" id="sizes" role="radiogroup"></div>
        </div>
        <div class="opt">
          <label class="opt-l" for="engrave" data-i="shop.engrave"></label>
          <input id="engrave" class="field" type="text" maxlength="14" autocomplete="off" spellcheck="false">
          <p class="opt-s" data-i="shop.engraveSub"></p>
        </div>

        <div class="buy">
          <div class="price"><b id="pPrice"></b><small id="pEdp" data-i="shop.edp"></small></div>
          <div class="qty" aria-label="Quantity">
            <button type="button" id="qMinus" aria-label="-">−</button><b id="qVal">1</b><button type="button" id="qPlus" aria-label="+">+</button>
          </div>
        </div>
        <button class="btn add" id="addBtn" type="button"><span id="addTxt"></span></button>
        <p class="ship" data-i="shop.ship"></p>
      </div>
    </aside>

    <div class="spray-wrap">
      <button class="spray-btn" id="sprayBtn" type="button" aria-label="Spray">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 10h6v10H9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 10V7h4v3M12 7V4h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18.5" cy="3.5" r=".9" fill="currentColor"/><circle cx="20" cy="6" r=".9" fill="currentColor"/><circle cx="17.5" cy="6.5" r=".9" fill="currentColor"/></svg>
        <span data-i="shop.spray"></span>
      </button>
      <p class="spray-tip" data-i="shop.sprayTip"></p>
    </div>

    <nav class="shelf-nav" id="shelfNav" aria-label="Scents"></nav>
    <div class="notes-layer" id="notesLayer" aria-hidden="true"></div>
  </section>

  <!-- ============ جرّبه: ساعة العطر (12 ساعة) ============ -->
  <section class="sec wear" id="wear">
    <div class="wrap wear-grid">
      <div class="wear-copy">
        <header class="sec-head rv">
          <p class="kicker" data-i="wear.k"></p>
          <h2 class="h2" data-i="wear.t"></h2>
          <p class="lead" data-i="wear.s"></p>
        </header>
        <div class="chips rv" id="wearChips" role="tablist"></div>
        <div class="legend rv" id="wearLegend"></div>
      </div>
      <div class="wear-stage rv">
        <canvas id="aura" aria-hidden="true"></canvas>
        <div class="wear-phase" id="wearPhase"></div>
      </div>
    </div>
    <div class="wrap wear-controls rv">
      <button class="play" id="wearPlay" type="button"><i></i><span id="wearPlayTxt"></span></button>
      <div class="clock">
        <canvas id="curve" aria-hidden="true"></canvas>
        <input id="wearT" type="range" min="0" max="12" step="0.01" value="0.2" aria-label="Hours">
        <div class="ticks"><span>0</span><span>3</span><span>6</span><span>9</span><span>12</span></div>
      </div>
      <div class="hours"><b id="wearH">0.0</b><small id="wearHL"></small></div>
    </div>
  </section>

  <!-- ============ الصنعة: دورق يمتلئ مع الخطوات ============ -->
  <section class="sec craft" id="craft">
    <div class="wrap craft-grid">
      <div class="flask-col">
        <div class="flask" id="flask">
          <svg viewBox="0 0 240 340" aria-hidden="true">
            <defs>
              <clipPath id="fk"><path d="M96 20h48v52c0 18 56 52 56 118a80 80 0 0 1-160 0c0-66 56-100 56-118z"/></clipPath>
              <linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop id="fl1" offset="0" stop-color="#ffd27a"/><stop id="fl2" offset="1" stop-color="#d9731a"/></linearGradient>
            </defs>
            <g clip-path="url(#fk)">
              <rect id="flLiq" x="0" y="340" width="240" height="340" fill="url(#fl)"/>
              <g id="flBub"></g>
            </g>
            <path d="M96 20h48v52c0 18 56 52 56 118a80 80 0 0 1-160 0c0-66 56-100 56-118z" fill="none" stroke="rgba(246,207,139,.7)" stroke-width="2.2"/>
            <path d="M84 20h72" stroke="rgba(246,207,139,.9)" stroke-width="4" stroke-linecap="round"/>
            <path d="M62 198c4 30 24 52 52 58" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="3" stroke-linecap="round"/>
          </svg>
          <div class="flask-glow" aria-hidden="true"></div>
          <b class="flask-n" id="flaskN">01</b>
        </div>
      </div>
      <div class="craft-steps">
        <header class="sec-head rv">
          <p class="kicker" data-i="craft.k"></p>
          <h2 class="h2" data-i="craft.t"></h2>
        </header>
        <ol class="steps" id="steps"></ol>
      </div>
    </div>
  </section>

  <!-- ============ آراء: بطاقات معلّقة تتأرجح ============ -->
  <section class="sec voices" id="voices">
    <div class="wrap">
      <header class="sec-head rv">
        <p class="kicker" data-i="voices.k"></p>
        <h2 class="h2" data-i="voices.t"></h2>
        <p class="lead" data-i="voices.s"></p>
      </header>
    </div>
    <div class="rail-wrap" id="rail">
      <div class="rail-bar" aria-hidden="true"></div>
      <div class="tags" id="tags"></div>
    </div>
  </section>

  <section class="sec contact" id="contact">
    <div class="wrap contact-grid">
      <header class="sec-head rv">
        <p class="kicker" data-i="contact.k"></p>
        <h2 class="h2" data-i="contact.t"></h2>
        <p class="lead" data-i="contact.s"></p>
      </header>
      <form class="mail rv" id="mail" autocomplete="off">
        <input id="mailIn" type="email" required aria-label="email">
        <button class="btn" type="submit"><span id="mailBtn" data-i="contact.btn"></span></button>
      </form>
    </div>
  </section>
</main>

<footer class="ftr">
  <div class="wrap ftr-grid">
    <div class="ftr-brand"><span class="logo-flame" id="ftrFlame"></span><span class="logo-word" data-i="brand"></span></div>
    <p class="ftr-made" data-i="footer.made"></p>
    <p class="ftr-note" data-i="footer.concept"></p>
    <p class="ftr-rights" data-i="footer.rights"></p>
  </div>
</footer>

<!-- ============ الحقيبة ============ -->
<div class="scrim-cart" id="cartScrim"></div>
<aside class="drawer" id="cart" aria-label="Bag" aria-hidden="true">
  <header class="drawer-h"><h3 id="cartTitle"></h3><button class="x" id="cartClose" type="button" aria-label="Close">×</button></header>
  <div class="drawer-body" id="cartBody"></div>
  <footer class="drawer-f" id="cartFoot"></footer>
</aside>

<!-- ============ إتمام الشراء ============ -->
<div class="modal" id="checkout" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="modal-in">
    <button class="x modal-x" id="coClose" type="button" aria-label="Close">×</button>
    <div class="co-main">
      <ol class="co-steps" id="coSteps"></ol>
      <div class="co-demo" id="coDemo"></div>
      <div class="co-pane" id="coPane"></div>
    </div>
    <aside class="co-side" id="coSide"></aside>
  </div>
</div>

<div class="fly-layer" id="flyLayer" aria-hidden="true"></div>
<div class="toast" id="toast" role="status"></div>

<script>
  if (location.protocol === 'file:') {
    document.addEventListener('DOMContentLoaded', function () {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;inset:0;z-index:999;display:grid;place-content:center;gap:12px;padding:30px;text-align:center;background:#070504;color:#f8ecd9;font:600 18px/1.6 system-ui,sans-serif';
      d.innerHTML = '<div style="font-size:42px">🔥</div><div>This page needs a local server (it uses 3D modules).</div><div style="color:#d2bb98;font-weight:500">Double-click <b>run-site.bat</b> in the project folder, or open the published link.</div>';
      document.body.appendChild(d);
    });
  }
</script>
<script src="js/content.js"></script>
<script type="module" src="js/app.js"></script>
<script src="js/cursor.js"></script>
</body>
</html>
